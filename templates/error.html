{% extends "base.html" %}
{% block title %}{{ title }} · Pokémon Legendary Predictor{% endblock %}
{% block content %}
<div class="row justify-content-center light-on-dark">
  <div class="col-md-8 col-lg-6 text-center">
    <i class="bi bi-exclamation-triangle-fill display-4 text-warning"></i>
    <h1 class="h3 mt-3">{{ code }} — {{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('index') }}">
      <i class="bi bi-house me-1"></i>Back to the predictor
    </a>
  </div>
</div>
{% endblock %}
